<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970">
  <rect width="1200" height="970" fill="#0A0A0A"/>
  <text x="600" y="50" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="bold">季度仪表盘：我们走在正轨上吗？</text>
  <text x="600" y="80" text-anchor="middle" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="15">Quarterly Dashboard: Are We on Track?</text>
  <text x="600" y="105" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13">连续两季度 3 个及以上指标红灯，就从“渐进改良”切换到“紧急干预”</text>
  <circle cx="400" cy="130" r="8" fill="#00BCD4"/>
  <text x="415" y="135" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">绿灯 On Track</text>
  <circle cx="540" cy="130" r="8" fill="#FF9800"/>
  <text x="555" y="135" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">黄灯 Watch</text>
  <circle cx="670" cy="130" r="8" fill="#FF4444"/>
  <text x="685" y="135" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">红灯 Intervene</text>

  <!-- 1 入门级岗位发布量同比 -->
  <rect x="80" y="160" width="530" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="111" cy="184" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="111" y="188" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">1</text>
  <text x="130" y="190" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">入门级岗位发布量同比</text>
  <text x="100" y="210" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Entry-Level Job Postings YoY Change</text>
  <rect x="100" y="230" width="160" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="180" y="250" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&gt; -5%</text>
  <rect x="270" y="230" width="160" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="350" y="250" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">-5% ~ -15%</text>
  <rect x="440" y="230" width="160" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="520" y="250" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&lt; -15%</text>
  <text x="100" y="290" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">AI替代的第一个可见信号：初级岗位消失速度</text>

  <!-- 2 就业人口比 (E/P) 半年变化 -->
  <rect x="630" y="160" width="490" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="661" cy="184" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="661" y="188" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">2</text>
  <text x="680" y="190" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">就业人口比 (E/P) 半年变化</text>
  <text x="650" y="210" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Employment-Population Ratio, 6-Month Change</text>
  <rect x="650" y="230" width="140" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="720" y="250" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&gt; -0.2pp</text>
  <rect x="800" y="230" width="140" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="870" y="250" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">-0.2 ~ -0.5pp</text>
  <rect x="950" y="230" width="140" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="1020" y="250" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&lt; -0.5pp</text>
  <text x="650" y="290" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">不会被“退出劳动力”粉饰——失业率会</text>

  <!-- 2b 长期失业（27周以上）占比 -->
  <rect x="80" y="330" width="530" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="111" cy="354" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="111" y="358" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="10" font-weight="bold">2b</text>
  <text x="130" y="360" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">长期失业（27周以上）占比</text>
  <text x="100" y="380" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Long-Term Unemployed, Share of Total Unemployed</text>
  <rect x="100" y="400" width="160" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="180" y="420" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&lt; 22%</text>
  <rect x="270" y="400" width="160" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="350" y="420" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">22-26%</text>
  <rect x="440" y="400" width="160" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="520" y="420" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&gt; 26%</text>
  <text x="100" y="460" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">失业的人出不出得来，比有多少人失业更能说明招聘冻结</text>

  <!-- 3 企业AI资本开支占营收比 -->
  <rect x="630" y="330" width="490" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="661" cy="354" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="661" y="358" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">3</text>
  <text x="680" y="360" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">企业AI资本开支占营收比</text>
  <text x="650" y="380" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Corporate AI Capital Expenditure / Revenue</text>
  <rect x="650" y="400" width="140" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="720" y="420" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">不挤出研发·人力</text>
  <rect x="800" y="400" width="140" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="870" y="420" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">挤出研发</text>
  <rect x="950" y="400" width="140" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="1020" y="420" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">挤出人力</text>
  <text x="650" y="460" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">区分“AI投资健康增长”与“用AI裁员套利”</text>

  <!-- 4 前沿加速卡交付周期 -->
  <rect x="80" y="500" width="530" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="111" cy="524" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="111" y="528" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">4</text>
  <text x="130" y="530" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">前沿加速卡交付周期</text>
  <text x="100" y="550" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Frontier Accelerator Delivery Lead Time</text>
  <rect x="100" y="570" width="160" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="172" y="590" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">下降</text>
  <polygon points="198,582 206,582 202,591" fill="#00BCD4"/>
  <rect x="270" y="570" width="160" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="342" y="590" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">持平</text>
  <polygon points="372,582 381,586 372,590" fill="#FF9800"/>
  <rect x="440" y="570" width="160" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="512" y="590" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">上升</text>
  <polygon points="538,590 546,590 542,581" fill="#FF4444"/>
  <text x="100" y="630" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">算力供应是否跟上需求 = AI普惠化进度</text>

  <!-- 5 养老金可支付年数 -->
  <rect x="630" y="500" width="490" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="661" cy="524" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="661" y="528" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">5</text>
  <text x="680" y="530" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">养老金可支付年数</text>
  <text x="650" y="550" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Pension Fund Solvency (Years Payable)</text>
  <rect x="650" y="570" width="140" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="720" y="590" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&gt; 8年</text>
  <rect x="800" y="570" width="140" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="870" y="590" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">5-8年</text>
  <rect x="950" y="570" width="140" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="1020" y="590" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">&lt; 5年</text>
  <text x="650" y="630" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">税基从工资切向资本/算力/碳的紧迫程度</text>

  <!-- 6 住房空置率 + 区域银行资本充足率 -->
  <rect x="80" y="670" width="530" height="150" rx="12" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
  <circle cx="111" cy="694" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="111" y="698" text-anchor="middle" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="bold">6</text>
  <text x="130" y="700" fill="#FFFFFF" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" font-weight="bold">住房空置率 + 区域银行资本充足率</text>
  <text x="100" y="720" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">Housing Vacancy + Regional Bank Capital</text>
  <rect x="100" y="740" width="160" height="30" rx="6" fill="#00BCD4" opacity="0.3"/>
  <text x="180" y="760" text-anchor="middle" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">双稳定</text>
  <rect x="270" y="740" width="160" height="30" rx="6" fill="#FF9800" opacity="0.3"/>
  <text x="350" y="760" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">单一恶化</text>
  <rect x="440" y="740" width="160" height="30" rx="6" fill="#FF4444" opacity="0.3"/>
  <text x="520" y="760" text-anchor="middle" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">双恶化</text>
  <text x="100" y="800" fill="#888888" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">按揭危机的早期预警信号</text>

  <!-- 为什么不用失业率 -->
  <rect x="630" y="670" width="490" height="150" rx="12" fill="#FF9800" fill-opacity="0.06" stroke="#FF9800" stroke-width="1"/>
  <text x="650" y="700" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="15" font-weight="bold">为什么第 2 项不用失业率？</text>
  <text x="650" y="722" fill="#AAAAAA" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">低招聘 + 低解雇时，失业率会因为人们退出劳动力</text>
  <text x="650" y="740" fill="#AAAAAA" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="12">而下降，给出与实际相反的信号。</text>
  <text x="650" y="768" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">2026年1月至7月（BLS 实测）：</text>
  <text x="650" y="791" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">失业率  4.3%</text>
  <polygon points="737,783 746,787 737,791" fill="#00BCD4"/>
  <text x="752" y="791" fill="#00BCD4" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">4.1%</text>
  <text x="830" y="791" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">（看似改善）</text>
  <text x="650" y="812" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">就业人口比  59.4%</text>
  <polygon points="779,804 788,808 779,812" fill="#FF4444"/>
  <text x="794" y="812" fill="#FF4444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="bold">58.9%</text>
  <text x="880" y="812" fill="#666666" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="11">（实际恶化）</text>

  <rect x="80" y="850" width="1040" height="50" rx="10" fill="#FF9800" fill-opacity="0.08" stroke="#FF9800" stroke-width="1"/>
  <text x="600" y="880" text-anchor="middle" fill="#FF9800" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="15" font-weight="bold">不要等到危机爆发才行动，也不要在数据还绿的时候就恐慌。按季度检查，按信号行动。</text>
  <text x="600" y="945" text-anchor="middle" fill="#444444" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="10">指标框架综合自: BLS（含 JOLTS）· OECD · IMF Financial Stability · Fed Regional Banking Data · 阈值口径与数据来源见正文 3.5–3.6 节</text>
</svg>
