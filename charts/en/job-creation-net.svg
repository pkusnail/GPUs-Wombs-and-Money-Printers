<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0A0A0A"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">History of Tech Revolutions: Net Creation, Not Net Destruction</text>
  <text x="600" y="80" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15">Every wave has destroyed jobs — and created more of them</text>

  <!-- WEF Waterfall Chart -->
  <text x="600" y="125" text-anchor="middle" fill="#2196F3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">WEF 2025 forecast: global job change by 2030</text>

  <!-- Axis -->
  <line x1="200" y1="400" x2="1000" y2="400" stroke="#555555" stroke-width="1"/>
  <text x="190" y="405" text-anchor="end" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">0</text>

  <!-- Created jobs bar (going up) -->
  <rect x="280" y="165" width="200" height="235" rx="8" fill="#00BCD4" opacity="0.8"/>
  <text x="380" y="155" text-anchor="middle" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold">+170M</text>
  <text x="380" y="290" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">New jobs</text>
  <text x="380" y="310" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Created by 2030</text>
  <text x="380" y="340" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">AI training / audit</text>
  <text x="380" y="358" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Human-AI design</text>
  <text x="380" y="376" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Green energy / care</text>

  <!-- Destroyed jobs bar (going down) -->
  <rect x="520" y="400" width="200" height="130" rx="8" fill="#FF4444" opacity="0.8"/>
  <text x="620" y="545" text-anchor="middle" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold">-92M</text>
  <text x="620" y="450" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Displaced jobs</text>
  <text x="620" y="470" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Lost by 2030</text>
  <text x="620" y="498" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Data entry / clerical</text>
  <text x="620" y="516" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Tellers / support / translation</text>

  <!-- Net bar -->
  <rect x="760" y="280" width="200" height="120" rx="8" fill="#FF9800" opacity="0.9"/>
  <text x="860" y="268" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">Net +78M</text>
  <text x="860" y="335" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Net gain</text>
  <text x="860" y="358" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Net new jobs</text>

  <!-- Plus/minus signs -->
  <text x="480" y="310" fill="#555555" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">+</text>
  <text x="720" y="470" fill="#555555" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">=</text>

  <!-- ATM Paradox -->
  <rect x="80" y="590" width="500" height="90" rx="10" fill="#2196F3" fill-opacity="0.06" stroke="#2196F3" stroke-width="1"/>
  <text x="100" y="618" fill="#2196F3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">The ATM Paradox</text>
  <text x="100" y="640" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Tellers per branch: 20 → 13 (↓35%)</text>
  <text x="100" y="658" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">Urban branches: <tspan fill="#00BCD4" font-weight="bold">↑43%</tspan> · Total tellers: 300K→600K (<tspan fill="#00BCD4" font-weight="bold">↑100%</tspan>)</text>
  <text x="100" y="674" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Lower unit cost → more branches → more total employment</text>

  <!-- 1/3 stat -->
  <rect x="620" y="590" width="500" height="90" rx="10" fill="#FF9800" fill-opacity="0.06" stroke="#FF9800" stroke-width="1"/>
  <text x="640" y="618" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Invisible New Jobs</text>
  <text x="640" y="643" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Today in the US,<tspan fill="#FF9800" font-weight="bold"> 1 in 3 jobs</tspan></text>
  <text x="640" y="663" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14"><tspan fill="#FF9800" font-weight="bold">did not exist 25 years ago</tspan></text>
  <text x="640" y="674" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">— McKinsey</text>

  <!-- Bottom note -->
  <text x="600" y="730" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Note: WEF forecasts may run optimistic, but the direction holds — every tech revolution has ended in net creation</text>

  <!-- Sources -->
  <text x="600" y="780" text-anchor="middle" fill="#444444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">Source: WEF Future of Jobs Report 2025 · McKinsey · AEI · IMF Finance &amp; Development</text>
</svg>
