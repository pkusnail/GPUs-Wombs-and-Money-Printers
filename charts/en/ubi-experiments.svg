<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0A0A0A"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">UBI Experiments: Cash Doesn't Make People Lazy</text>
  <text x="600" y="80" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15">Four programmes, four continents, one consistent result</text>

  <!-- 4 experiment cards -->

  <!-- Card 1: Alaska -->
  <rect x="80" y="120" width="510" height="200" rx="12" fill="#00BCD4" fill-opacity="0.06" stroke="#00BCD4" stroke-width="1.5"/>
  <text x="100" y="152" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">🇺🇸 Alaska</text>
  <text x="100" y="175" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">1982–present · 40+ years running</text>
  <rect x="100" y="190" width="120" height="50" rx="8" fill="#0A0A0A" stroke="#00BCD4" stroke-width="1"/>
  <text x="160" y="215" text-anchor="middle" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">$1,700</text>
  <text x="160" y="233" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">/person/yr (2025)</text>
  <text x="240" y="210" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Oil revenue paid out to all</text>
  <text x="240" y="230" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Every resident, no conditions</text>
  <text x="100" y="265" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Results:</text>
  <text x="100" y="285" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ Employment held ✓ Spending up ✓ Poverty down</text>
  <text x="100" y="305" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">Health spend: every $1 paid out saves more than $1 later</text>

  <!-- Card 2: Finland -->
  <rect x="610" y="120" width="510" height="200" rx="12" fill="#2196F3" fill-opacity="0.06" stroke="#2196F3" stroke-width="1.5"/>
  <text x="630" y="152" fill="#2196F3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">🇫🇮 Finland</text>
  <text x="630" y="175" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">2017-2018 · Randomised controlled trial</text>
  <rect x="630" y="190" width="120" height="50" rx="8" fill="#0A0A0A" stroke="#2196F3" stroke-width="1"/>
  <text x="690" y="215" text-anchor="middle" fill="#2196F3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">€560</text>
  <text x="690" y="233" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">/person/mo</text>
  <text x="770" y="210" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">2,000 unemployed people</text>
  <text x="770" y="230" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Monthly, no conditions</text>
  <text x="630" y="265" fill="#2196F3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Results:</text>
  <text x="630" y="285" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ Employment = control group (no laziness)</text>
  <text x="630" y="305" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ Wellbeing↑ ✓ Trust↑ ✓ Health↑ ✓ Depression↓</text>

  <!-- Card 3: Stockton -->
  <rect x="80" y="340" width="510" height="200" rx="12" fill="#FF9800" fill-opacity="0.06" stroke="#FF9800" stroke-width="1.5"/>
  <text x="100" y="372" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">🇺🇸 Stockton SEED</text>
  <text x="100" y="395" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">2019-2021 · California, USA</text>
  <rect x="100" y="410" width="120" height="50" rx="8" fill="#0A0A0A" stroke="#FF9800" stroke-width="1"/>
  <text x="160" y="435" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">$500</text>
  <text x="160" y="453" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">/person/mo</text>
  <text x="240" y="430" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">125 residents</text>
  <text x="240" y="450" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Two years, no conditions</text>
  <text x="100" y="485" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Results:</text>
  <text x="100" y="505" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Full-time employment: <tspan fill="#FF4444">28%</tspan> → <tspan fill="#00BCD4" font-weight="bold">40%</tspan> (+12 pts)</text>
  <text x="100" y="525" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ Cash made them job-hunt harder ✓ Income volatility↓</text>

  <!-- Card 4: Kenya -->
  <rect x="610" y="340" width="510" height="200" rx="12" fill="#FF4444" fill-opacity="0.06" stroke="#FF4444" stroke-width="1.5"/>
  <text x="630" y="372" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">🇰🇪 Kenya · GiveDirectly</text>
  <text x="630" y="395" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">2018–present · Largest UBI trial worldwide</text>
  <rect x="630" y="410" width="120" height="50" rx="8" fill="#0A0A0A" stroke="#FF4444" stroke-width="1"/>
  <text x="690" y="435" text-anchor="middle" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">$22.50</text>
  <text x="690" y="453" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">/person/mo (12 yrs)</text>
  <text x="770" y="430" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Thousands of villages</text>
  <text x="770" y="450" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Long-run cash transfers</text>
  <text x="630" y="485" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Results:</text>
  <text x="630" y="505" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ New businesses↑ ✓ Nutrition up ✓ Violence↓</text>
  <text x="630" y="525" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">✓ Lump-sum recipients built better businesses</text>

  <!-- Cross-study conclusion -->
  <rect x="80" y="570" width="1040" height="100" rx="12" fill="#FF9800" fill-opacity="0.08" stroke="#FF9800" stroke-width="1.5"/>
  <text x="600" y="600" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Cross-Study Conclusion</text>
  <text x="600" y="628" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Across trials in Finland, Alaska, Germany, Africa and US cities:</text>
  <text x="600" y="652" text-anchor="middle" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Almost nobody quits. Some cut hours to care for family or study; others use the net to find better work.</text>

  <!-- Bottom -->
  <text x="600" y="710" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">Funding path: payroll tax → capital / compute / carbon mix · a small slice of AI's extra GDP growth suffices</text>

  <!-- Sources -->
  <text x="600" y="780" text-anchor="middle" fill="#444444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10">Source: Alaska Permanent Fund · Finnish Social Insurance (Kela) · GiveDirectly/IPA · Stockton SEED Program</text>
</svg>
