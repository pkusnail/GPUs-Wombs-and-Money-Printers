<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770">
<rect width="1200" height="770" fill="#0A0A0A"/>
<text x="600" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">Level 5: What Is Actually Left After Unloading</text>
<text x="600" y="76" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">The Residue — if you can't name what's left, the first four levels become escapism</text>
<text x="600" y="120" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold">What the ladder unloads (not yours, however well or badly you're doing)</text>
<rect x="112" y="138" width="224" height="44" rx="9" fill="#00BCD4" fill-opacity="0.06" stroke="#00BCD4" stroke-width="1"/>
<text x="224" y="166" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">"Am I falling behind?"</text>
<rect x="364" y="138" width="224" height="44" rx="9" fill="#2196F3" fill-opacity="0.06" stroke="#2196F3" stroke-width="1"/>
<text x="476" y="166" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">"Not in the surviving class"</text>
<rect x="616" y="138" width="224" height="44" rx="9" fill="#9C27B0" fill-opacity="0.06" stroke="#9C27B0" stroke-width="1"/>
<text x="728" y="166" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">"My generation got bad timing"</text>
<rect x="868" y="138" width="224" height="44" rx="9" fill="#FF4444" fill-opacity="0.06" stroke="#FF4444" stroke-width="1"/>
<text x="980" y="166" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">"Failing by an old ruler"</text>
<line x1="600" y1="192" x2="600" y2="214" stroke="#888888" stroke-width="2"/>
<path d="M593,214 L600,228 L607,214 z" fill="#888888"/>
<rect x="90" y="244" width="488" height="222" rx="9" fill="#4CAF50" fill-opacity="0.11" stroke="#4CAF50" stroke-width="2"/>
<text x="334" y="286" text-anchor="middle" fill="#4CAF50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">How you treat the people near you</text>
<line x1="220" y1="304" x2="448" y2="304" stroke="#4CAF50" stroke-width="1" opacity="0.5"/>
<text x="120" y="338" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">Needs no resources, works instantly, immune to circumstance.</text>
<text x="120" y="368" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">Employed, laid off, promoted, pay cut — this does not change.</text>
<text x="120" y="398" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">After four zoom-outs, the only outward act still fully yours.</text>
<text x="120" y="428" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">And the only one other people feel immediately.</text>
<rect x="622" y="244" width="488" height="222" rx="9" fill="#FF9800" fill-opacity="0.11" stroke="#FF9800" stroke-width="2"/>
<text x="866" y="286" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">Where you spend your time</text>
<line x1="752" y1="304" x2="980" y2="304" stroke="#FF9800" stroke-width="1" opacity="0.5"/>
<text x="652" y="338" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">One day lived is one fewer left — arithmetic, not sentiment.</text>
<text x="652" y="368" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">Income fluctuates, time doesn't: issued daily, zeroed daily.</text>
<text x="652" y="398" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">You can't set how much is left, only what today goes into.</text>
<text x="652" y="428" text-anchor="start" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2">Life is fragile, accidents common — so don't postpone it.</text>
<rect x="90" y="486" width="1020" height="74" rx="9" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="600" y="516" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Just these two. They need no permission, and survive layoffs, raises, promotions and demotions alike</text>
<text x="600" y="542" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5">Pitifully little. But once the first four levels are unloaded, this is all of it — and it's true, not consolation.</text>
<rect x="90" y="684" width="1020" height="72" rx="9" fill="#FF4444" fill-opacity="0.07" stroke="#FF4444" stroke-width="1.5"/>
<text x="600" y="712" text-anchor="middle" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold">Said plainly: what a mindset cannot fix</text>
<text x="600" y="736" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.8">Shrinking industry · redefined role · raises losing to prices · ageing parents · mortgage cash flow · medical bills · clinical depression — none of it</text>
</svg>
