<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<rect width="1200" height="800" fill="#0A0A0A"/>
<text x="600" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">The Daily Ledger: Why We Count Money But Not Time</text>
<text x="600" y="76" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">A One-Way Ticket — everyone shares the same destination</text>
<rect x="70" y="110" width="1060" height="96" rx="9" fill="#00BCD4" fill-opacity="0.08" stroke="#00BCD4" stroke-width="1.5"/>
<text x="600" y="142" text-anchor="middle" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">One more day lived is one fewer looking back</text>
<text x="600" y="170" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">So today is the youngest and most energetic day of the rest of your life — tomorrow won't be younger.</text>
<text x="600" y="194" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">A day is an experience: once spent it is gone. No carry-forward, no reissue.</text>
<text x="600" y="238" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">So every day actually keeps a ledger</text>
<rect x="150" y="254" width="440" height="86" rx="9" fill="#4CAF50" fill-opacity="0.1" stroke="#4CAF50" stroke-width="1.8"/>
<text x="370" y="286" text-anchor="middle" fill="#4CAF50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Happy today → you gained</text>
<text x="370" y="316" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5">The day bought you something</text>
<rect x="610" y="254" width="440" height="86" rx="9" fill="#FF4444" fill-opacity="0.1" stroke="#FF4444" stroke-width="1.8"/>
<text x="830" y="286" text-anchor="middle" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Bad mood today → you ran a loss</text>
<text x="830" y="316" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5">Time was debited, nothing came back</text>
<rect x="70" y="368" width="1060" height="220" rx="9" fill="#9C27B0" fill-opacity="0.07" stroke="#9C27B0" stroke-width="1.5"/>
<text x="600" y="400" text-anchor="middle" fill="#9C27B0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">But why do most people only balance the first ledger?</text>
<rect x="110" y="418" width="470" height="88" rx="9" fill="#FF9800" fill-opacity="0.08" stroke="#FF9800" stroke-width="1.2"/>
<text x="345" y="448" text-anchor="middle" fill="#FF9800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">He has been poor, so he fears no money</text>
<text x="345" y="474" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.8">He has lived through days without money;</text>
<text x="345" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.8">that fear is real, trained by experience.</text>
<rect x="620" y="418" width="470" height="88" rx="9" fill="#00BCD4" fill-opacity="0.08" stroke="#00BCD4" stroke-width="1.2"/>
<text x="855" y="448" text-anchor="middle" fill="#00BCD4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">He has never died, so he wastes time freely</text>
<text x="855" y="474" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.8">"A day gone is one fewer, one step closer" —</text>
<text x="855" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.8">nobody has ever experienced that first-hand.</text>
<text x="600" y="538" text-anchor="middle" fill="#9C27B0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Fear is trained by experience — and death offers no rehearsal.</text>
<text x="600" y="566" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5">So the ledger is born biased toward money and short-changes time. Not a character flaw — a training-data problem.</text>
<rect x="70" y="614" width="1060" height="80" rx="9" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="600" y="646" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">Life is a one-way ticket and an experience — you bring nothing in, take nothing out</text>
<text x="600" y="674" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5">The numbers — how many houses, how many cars, how much cash — are all external. They measure how others see you, not how you live.</text>
<rect x="70" y="712" width="1060" height="66" rx="9" fill="#FF4444" fill-opacity="0.07" stroke="#FF4444" stroke-width="1.5"/>
<text x="600" y="740" text-anchor="middle" fill="#FF4444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">Said plainly: this isn't "don't earn", and isn't "live for today"</text>
<text x="600" y="764" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Earn money, hedge risk — that is Vol. 2. One point only here: the ledger shouldn't be kept half.</text>
</svg>
